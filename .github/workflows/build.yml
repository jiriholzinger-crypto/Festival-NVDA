# Builds festlib.dll and festhost64.exe from source and packs the NVDA add-on.
#   - every push and pull request: build, the add-on is kept as a workflow artifact
#   - a pushed tag v<version> (e.g. v2026.11.6): build and publish a GitHub release
#     with festival-<version>.nvda-addon attached
#   - "Run workflow" button (Actions tab): build; optional version and release
name: Build add-on

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Add-on version, e.g. 2026.11.6 (empty: version from manifest.ini)"
        required: false
      release:
        description: "Publish a release with this version"
        type: boolean
        default: false

permissions:
  contents: write

env:
  LLVM_MINGW_VERSION: "20251104"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=true
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
            release="${INPUT_RELEASE:-false}"
          else
            version=$(sed -n 's/^version = //p' addon/manifest.ini)
            release=false
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::version must look like 2026.11.6, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Add-on version $version, release: $release"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install meson and ninja
        run: python -m pip install meson ninja

      - name: Cache llvm-mingw
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: ~/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-ubuntu-x86_64

      - name: Download llvm-mingw
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          name=llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-22.04-x86_64
          curl -sSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/${name}.tar.xz"
          tar -xf /tmp/llvm-mingw.tar.xz -C /tmp
          mv "/tmp/${name}" ~/llvm-mingw

      - name: Prepare scripts
        # Uploads made without git can lose the executable flag or get Windows
        # line endings; the scripts run through sh and are normalized here.
        run: |
          sed -i 's/\r$//' tools/build-addon.sh festlib64/build.sh festlib64/*.diff
          chmod +x tools/build-addon.sh festlib64/build.sh

      - name: Build
        run: sh tools/build-addon.sh "${{ steps.version.outputs.version }}" ~/llvm-mingw

      - name: Check the add-on
        run: |
          addon="dist/festival-${{ steps.version.outputs.version }}.nvda-addon"
          unzip -l "$addon" | grep -q "synthDrivers/festival/festlib.dll"
          unzip -l "$addon" | grep -q "synthDrivers/festival/festhost64.exe"
          unzip -l "$addon" | grep -q "globalPlugins/festivalVoices/catalog.py"
          unzip -p "$addon" manifest.ini | grep -q "^version = ${{ steps.version.outputs.version }}$"
          ls -la "$addon"

      - uses: actions/upload-artifact@v7
        with:
          name: festival-${{ steps.version.outputs.version }}
          path: dist/festival-${{ steps.version.outputs.version }}.nvda-addon
          compression-level: 0

      - name: Release notes
        if: steps.version.outputs.release == 'true'
        run: |
          # the section "## <version>" of CHANGELOG.md
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## / { on = ($2 == v); next }
            on { print }' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Festival synthesizer for NVDA ${{ steps.version.outputs.version }}" > notes.md; fi
          cat notes.md

      - name: Publish release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          addon="dist/festival-$version.nvda-addon"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$addon" --clobber
          else
            gh release create "$tag" "$addon" \
              --title "Festival for NVDA $version" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
          fi
